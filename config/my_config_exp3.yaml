data_args:
  tmpdir: "tmp"
  hf_cache: "~/cache/huggingface"
  dataset_path: "cache/datasets"
  language: 'greek'
  sampling_rate: 16000
  other_to_train: True

main_args:
  datasets:
    - common_voice
    - fleurs
    - css10
    - hparl
  split_type: 'default'
  results_path: "cache/results"
  checkpoint_path: "cache/checkpoints"

dual_fuse_args:
  checkpoint_path: "cache/checkpoints"
   ## Data Configurations
  interleave_temperature: 1.2
  micro_data: False
  micro_size: 800
  randomize: True
  norm_mono: False
  ## Regularization & Augmentation Configurations
  blank_training: True
  audio_dropout: 0.1
  text_perturbation: True
  text_dropout: 0.1
  spec_augment: True
  ## Input Injection Configurations
  include_adapter: False
  hidden_dim: 2048
  static_projector: False
  downsample_K: 5
  input_downsample: 'reshape'
  ## Cross-Attention Injection Configurations
  downsample_L: 5
  injection_downsample: 'conv1d'
  injection_layers: [10, 20, 30]
  pyramid_layers: False
  downsamplers: 'injection_common' # common, injection_common, different
  causal_fusion: False
  gated_cross_attention: False
  positional_info: False
  ## LoRA Configurations
  linguistic_lora: True
  acoustic_lora: False
  lora_params: ["q_proj", "k_proj", "v_proj", "o_proj"]
  proj_lr: 0.0001
  lora_lr: 0.0001
  two_stage: False
  ## Auxiliary Losses Configurations
  predict_duration: False
  duration_resolution: 0.1
  max_duration: 30.0
  ctc: False
  audio_forecasting: False
  duration_weight: 0.1
  ctc_weight: 0.1
  audio_weight: 0.5
  ## Training Behavior Configurations
  early_stopping_patience: 15
  first_stage_epochs: 10
  second_stage_epochs: 40
  ## Prompt Configurations
  prompt_persona: none
  prompt_instruction: "\nΜετάγραψε το προηγούμενο ηχητικό απόσπασμα σε ελληνικό κείμενο με απόλυτη ακρίβεια."
  prompt_verbatim: False
  training_args: {
    # --- PERFORMANCE OPTIMIZATIONS ---
    'fp16': True,                   # CRITICAL: Native speed for Titan RTX
    'dataloader_num_workers': 4,    # Optimized for 14-core CPU (3 workers * 4 GPUs = 12 threads)
    'dataloader_pin_memory': True,  # Fast CPU->GPU transfer
    'per_device_train_batch_size': 2, # Maximize VRAM usage
    'gradient_accumulation_steps': 4,  # Effective Batch = 8 * 4 * 2 = 96
    'gradient_checkpointing': True,
    'gradient_checkpointing_kwargs': {'use_reentrant': False},
    'ddp_find_unused_parameters': True,

    # --- TRAINING BEHAVIOR ---
    'warmup_steps': 400,
    'lr_scheduler_type': 'linear',
    'optim': 'adamw_torch',

    # --- LOGGING & SAVING ---
    'report_to': 'tensorboard',
    'logging_steps': 10,
    'save_strategy': 'steps',
    'save_steps': 500,
    'eval_strategy': 'steps',
    'eval_steps': 500,
    'save_total_limit': 3,
    'eval_accumulation_steps': 2,
    'per_device_eval_batch_size': 4,
    'num_train_epochs': 60,

    # --- CRITICAL MODEL SETTINGS ---
    'remove_unused_columns': False, # REQUIRED for custom SlamDataCollator
    'group_by_length': False,       # Prevent crash (missing input_ids)
    'predict_with_generate': True,  # REQUIRED to calculate WER/CER during eval
    'do_train': True,

    # --- EARLY STOPPING SETTINGS ---
    'load_best_model_at_end': True,
    'metric_for_best_model': 'eval_wer',
    'greater_is_better': False,
    'generation_max_length': 410,

    'generation_config': {
      'num_beams': 1,
      'do_sample': False,
      'max_new_tokens': 410,
      'use_cache': True,
    }
  }

eval_args:
  training_args: {
    'per_device_eval_batch_size': 4,
    'eval_accumulation_steps': 4,
    'remove_unused_columns': False,
    'predict_with_generate': True,
    'fp16': True,
    'dataloader_num_workers': 4,
    'dataloader_pin_memory': True,
    'eval_strategy': 'no',
    'report_to': 'none',
    'generation_max_length': 512,
    'generation_config': {
      'num_beams': 4,
      'do_sample': False,
      'repetition_penalty': 1.15,
      'length_penalty': 1.0,
      'max_new_tokens': 512,
      'use_cache': True,
    }
  }
