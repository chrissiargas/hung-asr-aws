name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.1 torchaudio==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r tests/requirements.txt

      - name: Check for syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run unit tests
        run: pytest
